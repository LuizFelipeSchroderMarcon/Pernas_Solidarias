# Identificação do Projeto
sonar.projectKey=pernas-solidarias
sonar.projectName=Pernas Solidárias - Dev
sonar.projectVersion=1.0.0

# Codificação
sonar.sourceEncoding=UTF-8

# Diretórios de Código-Fonte e Testes
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Arquivos e pastas a ignorar
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vite/**,backend/src/database/init-database.sql,**/*.drawio,**/RFC/**,**/spec.md,**/coverage/**
sonar.coverage.exclusions=backend/src/server.ts,backend/src/database/**,backend/src/models/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts,frontend/src/types/**
# Se necessário excluir as pastas frontend/src/pages/**,frontend/src/context/** dos arquivos
# Relatórios de Cobertura de Testes (LCOV)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Mapeamento do TypeScript
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

