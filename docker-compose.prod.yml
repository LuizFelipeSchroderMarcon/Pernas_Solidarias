services:
  # 1. Banco de Dados PostgreSQL (Produção / Homologação)
  db:
    image: postgres:16-alpine
    container_name: pernas_db_${AMBIENTE:-prod}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pernas_solidarias}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pernas_solidarias}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. API Backend (Produção / Homologação)
  backend:
    image: ghcr.io/luizfelipeschrodermarcon/pernas-solidarias-backend:${TAG_IMAGEM:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pernas_backend_${AMBIENTE:-prod}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pernas_solidarias}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Frontend Web SPA + Proxy Reverso /api com Nginx (Produção / Homologação)
  frontend:
    image: ghcr.io/luizfelipeschrodermarcon/pernas-solidarias-frontend:${TAG_IMAGEM:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: pernas_frontend_${AMBIENTE:-prod}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. Cloudflare Tunnel (acesso público HTTPS sem abrir portas na EC2)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pernas_tunnel_${AMBIENTE:-prod}
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy

  # 5. Prometheus (coleta de métricas internas da API — retenção curta para t3.micro)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pernas_prometheus_${AMBIENTE:-prod}
    restart: always
    mem_limit: 192m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  # 6. Grafana (dashboards de observabilidade acessados via Cloudflare Tunnel)
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: pernas_grafana_${AMBIENTE:-prod}
    restart: always
    mem_limit: 192m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://monitor.pernassolidarias.social.br}
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
