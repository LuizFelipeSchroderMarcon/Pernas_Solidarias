server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker para re-resolver o IP do container backend após recriações
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos básicos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip para otimização de largura de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy reverso para a API Backend (mesma origem, evitando CORS)
    location ^~ /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserva Content-Disposition para download de planilhas Excel (/api/export)
        proxy_pass_header Content-Disposition;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache eficiente para estáticos com hash gerados pelo Vite
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA routing: qualquer rota client-side do React Router é tratada pelo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Oculta assinatura do servidor
    server_tokens off;
}
