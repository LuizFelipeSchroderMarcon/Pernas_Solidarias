name: CI - Pernas Solidárias

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'RFC/**'
      - '**/*.md'
      - '**/*.fig'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'RFC/**'
      - '**/*.md'
      - '**/*.fig'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_sonar:
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Build & Database Init)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pernas_solidarias
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pernas_solidarias"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pernas_solidarias
      JWT_SECRET: ci_test_jwt_secret_pernas_solidarias_2026
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do Backend
        run: npm install --no-audit --no-fund

      - name: Validar tipagem e Build (TypeScript)
        run: npm run build

      - name: Validar criação de tabelas e seed inicial (db:init)
        run: npm run db:init

      - name: Validar recriação limpa do schema (db:reset)
        run: npm run db:reset

      - name: Executar testes automatizados do Backend com cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar relatório LCOV do Backend
        if: ${{ !inputs.skip_sonar }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 1

  frontend-ci:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:3000/api

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        run: npm install --no-audit --no-fund

      - name: Validar tipagem e Build de Produção (tsc + Vite)
        run: npm run build

      - name: Executar testes automatizados do Frontend com cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar relatório LCOV do Frontend
        if: ${{ !inputs.skip_sonar }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonarcloud:
    name: SonarCloud Code Analysis
    needs: [backend-ci, frontend-ci]
    if: ${{ !inputs.skip_sonar }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo do repositório (necessário para blame/new code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar relatório LCOV do Backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Baixar relatório LCOV do Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Validar configuração do SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN está vazio! Cadastre em GitHub → Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          AUTH_RESP="$(curl -s -u "${SONAR_TOKEN}:" https://sonarcloud.io/api/authentication/validate)"
          echo "Validação de autenticação SonarCloud: ${AUTH_RESP}"
          if ! echo "${AUTH_RESP}" | grep -q '"valid":true'; then
            echo "::error::SONAR_TOKEN inválido ou revogado no SonarCloud."
            exit 1
          fi

      - name: Executar análise no SonarCloud
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

