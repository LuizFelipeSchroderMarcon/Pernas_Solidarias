name: CI - Pernas Solidárias

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'RFC/**'
      - '**/*.md'
      - '**/*.fig'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - 'RFC/**'
      - '**/*.md'
      - '**/*.fig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Build & Database Init)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pernas_solidarias
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pernas_solidarias"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pernas_solidarias
      JWT_SECRET: ci_test_jwt_secret_pernas_solidarias_2026
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do Backend
        run: npm install --no-audit --no-fund

      - name: Validar tipagem e Build (TypeScript)
        run: npm run build

      - name: Validar criação de tabelas e seed inicial (db:init)
        run: npm run db:init

      - name: Validar recriação limpa do schema (db:reset)
        run: npm run db:reset

  frontend-ci:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:3000/api

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        run: npm install --no-audit --no-fund

      - name: Validar tipagem e Build de Produção (tsc + Vite)
        run: npm run build

